<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Chinese traditional pattern - inspired by classical motifs -->
  <!-- Bamboo elements -->
  <path d="M30,20 Q50,10 70,20 T110,20 T150,20 T190,20" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M20,40 Q40,30 60,40 T100,40 T140,40 T180,40" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M40,60 Q60,50 80,60 T120,60 T160,60 T200,60" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.1"/>
  
  <!-- Circular cloud/wave patterns -->
  <path d="M20,100 Q30,90 40,100 Q50,110 60,100 Q70,90 80,100 Q90,110 100,100 Q110,90 120,100 Q130,110 140,100 Q150,90 160,100 Q170,110 180,100 Q190,90 200,100" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.08"/>
  <path d="M20,140 Q30,130 40,140 Q50,150 60,140 Q70,130 80,140 Q90,150 100,140 Q110,130 120,140 Q130,150 140,140 Q150,130 160,140 Q170,150 180,140 Q190,130 200,140" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.08"/>
  
  <!-- Classical Chinese knot motif -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="150" cy="50" r="15" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="50" cy="150" r="15" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="150" cy="150" r="15" fill="none" stroke="#8B4513" stroke-width="1" stroke-opacity="0.08"/>
  
  <!-- Intersecting lines representing harmony -->
  <line x1="0" y1="0" x2="200" y2="200" stroke="#8B4513" stroke-width="1" stroke-opacity="0.05"/>
  <line x1="200" y1="0" x2="0" y2="200" stroke="#8B4513" stroke-width="1" stroke-opacity="0.05"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="#8B4513" stroke-width="1" stroke-opacity="0.05"/>
  <line x1="0" y1="100" x2="200" y2="100" stroke="#8B4513" stroke-width="1" stroke-opacity="0.05"/>
</svg>