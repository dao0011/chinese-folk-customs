<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Unsubscribe — Folk Calm</title>
    <meta name="description" content="Request removal from Folk Calm email updates.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/components.js?v=3" defer></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <div id="site-disclaimer-banner"></div>
    <div id="site-header"></div>

    <main id="main" class="wrap">
        <article>
            <h1>Unsubscribe</h1>
            <p class="lead">Send us the email address you want removed from Folk Calm updates.</p>

            <form class="email-cta-form" action="mailto:unsubscribe@tcmwellness.xyz?subject=Unsubscribe" method="post" enctype="text/plain">
                <input type="email" name="email_address" placeholder="Your email address" required aria-label="Email address">
                <button type="submit">Send Unsubscribe Request</button>
            </form>

            <p class="privacy-note">Your request will be processed manually. You can also reply STOP to any Folk Calm email.</p>
        </article>
    </main>

    <div id="site-footer"></div>
    <script src="js/main.js" defer></script>
</body>
</html>
